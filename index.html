<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;

// --- Gemini API Setup ---
const callGemini = async (contents, systemInstruction = null, generationConfig = null) => {
    const apiKey = ""; // API key is injected by the environment
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
    
    const payload = { contents };
    if (systemInstruction) {
        payload.systemInstruction = { parts: [{ text: systemInstruction }] };
    }
    if (generationConfig) {
        payload.generationConfig = generationConfig;
    }

    const delays = [1000, 2000, 4000, 8000, 16000];
    let lastError = null;

    for (let i = 0; i <= delays.length; i++) {
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            if (!response.ok) {
                throw new Error(`API Error: ${response.status}`);
            }
            
            return await response.json();
        } catch (err) {
            lastError = err;
            if (i < delays.length) {
                await new Promise(res => setTimeout(res, delays[i]));
            }
        }
    }
    throw lastError;
};

// Helper function to read file as Base64 string for image analysis
const getBase64 = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
});

// AI Chat Component
const AIChat = ({ messages, onSendMessage, isLoading }) => {
    const [input, setInput] = useState('');
    const messagesEndRef = useRef(null);

    const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
    };

    useEffect(scrollToBottom, [messages]);

    const handleSend = () => {
        if (input.trim() && !isLoading) {
            onSendMessage(input);
            setInput('');
        }
    };

    const handleKeyPress = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }
    };

    return (
        <div className="ai-page">
            <div className="ai-messages">
                {messages.map((msg, idx) => (
                    <div key={idx} className={`message-ai ${msg.sender}`}>
                        {msg.text}
                    </div>
                ))}
                {isLoading && (
                    <div className="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                )}
                <div ref={messagesEndRef} />
            </div>
            <div style={{ display: 'flex', gap: 10 }}>
                <input 
                    type="text" 
                    style={{ flex: 1, padding: 14, borderRadius: 44, border: "1px solid #dbe5ef", fontSize: "0.95rem", outline: 'none' }}
                    placeholder="Ask me anything about health, symptoms, or hospitals..."
                    value={input}
                    onChange={(e) => setInput(e.target.value)}
                    onKeyPress={handleKeyPress}
                    disabled={isLoading}
                />
                <button 
                    style={{ background: "#0a3147", border: "none", borderRadius: 48, width: 52, color: "white", fontSize: "1.2rem", cursor: "pointer", opacity: isLoading ? 0.6 : 1 }}
                    onClick={handleSend}
                    disabled={isLoading}
                >
                    <i className="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    );
};

// Prescription Analysis Component
const PrescriptionAnalyzer = ({ showToast }) => {
    const [doubtText, setDoubtText] = useState('');
    const [prescFile, setPrescFile] = useState(null);
    const [previewUrl, setPreviewUrl] = useState('');
    const [analyzing, setAnalyzing] = useState(false);
    const [analysisRes, setAnalysisRes] = useState(null);
    const fileRef = useRef(null);

    const handleAnalyze = async () => {
        if (!prescFile && !doubtText.trim()) {
            showToast("⚠️ Please describe your symptoms or upload an image first.");
            return;
        }
        setAnalyzing(true);
        
        try {
